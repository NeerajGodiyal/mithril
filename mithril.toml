# Mithril Configuration for catchup-rpc mode
# Usage: ./mithril catchup-rpc --config mithril.toml

# Top-level paths (Firedancer-style)
scratch_directory = "/mnt/scratch/scratch"

[ledger]
    # Path containing slot.json files
    path = "/mnt/scratch/blocks"

    # Output path for writing AccountsDB data to
    accounts_path = "/mnt/accountsdb"

[rpc]
    # Primary RPC endpoint (Helius mainnet)
    # Replace YOUR_API_KEY with your actual API key
    rpc = "https://mainnet.helius-rpc.com/?api-key=YOUR_API_KEY"

    # Path to file containing list of RPC nodes
    rpc_node_list = "/home/ubuntu/rpcs.txt"

    # RPC server port for Solana-compatible JSON-RPC interface
    port = 8899

[replay]
    # Transaction parallelism
    txpar = 96
