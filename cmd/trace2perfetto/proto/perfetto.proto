// Minimal subset of Perfetto trace protos for converting Go traces.
// Based on https://perfetto.dev/docs/reference/trace-packet-proto

syntax = "proto3";

package perfetto.protos;

option go_package = "github.com/Overclock-Validator/mithril/cmd/trace2perfetto/proto";

// Top-level trace container
message Trace {
  repeated TracePacket packet = 1;
}

// A single trace packet
message TracePacket {
  // Timestamp in nanoseconds
  uint64 timestamp = 8;

  // Sequence ID for ordering
  uint32 trusted_packet_sequence_id = 10;

  oneof data {
    TrackDescriptor track_descriptor = 60;
    TrackEvent track_event = 11;
  }
}

// Describes a track (process, thread, or custom)
message TrackDescriptor {
  uint64 uuid = 1;
  string name = 2;
  ProcessDescriptor process = 3;
  ThreadDescriptor thread = 4;
  uint64 parent_uuid = 5;
}

// Process descriptor
message ProcessDescriptor {
  int32 pid = 1;
  string process_name = 6;
}

// Thread descriptor
message ThreadDescriptor {
  int32 pid = 1;
  int32 tid = 2;
  string thread_name = 5;
}

// A trace event on a track
message TrackEvent {
  // Categories for filtering
  repeated string categories = 22;

  // Event name
  string name = 23;

  // Event type
  Type type = 9;

  // Track this event belongs to
  uint64 track_uuid = 11;

  // Debug annotations (key-value metadata)
  repeated DebugAnnotation debug_annotations = 4;

  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SLICE_BEGIN = 1;
    TYPE_SLICE_END = 2;
    TYPE_INSTANT = 3;
  }
}

// Debug annotation for key-value metadata
// See: https://perfetto.dev/docs/reference/trace-packet-proto
message DebugAnnotation {
  // Name of the annotation (for dictionary entries)
  string name = 10;

  // Value - use one of these fields
  oneof value {
    bool bool_value = 2;
    uint64 uint_value = 3;
    int64 int_value = 4;
    double double_value = 5;
    string string_value = 6;
    uint64 pointer_value = 7;
  }

  // Nested structures
  repeated DebugAnnotation dict_entries = 11;
  repeated DebugAnnotation array_values = 12;
}
