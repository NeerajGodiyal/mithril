# Mithril Configuration File
# Copy this file and customize for your deployment.
# CLI flags override these values when both are specified.
#
# Configuration structure follows Firedancer conventions for familiarity.

# ============================================================================
# TOP-LEVEL
# ============================================================================

# Name of this Mithril instance
# name = "mithril1"

# Path for downloads (e.g. snapshots) and other temp state
# scratch_directory = "/tmp"

# ============================================================================
# [ledger] - Ledger and storage paths
# ============================================================================

[ledger]
    # Path containing slot.json files (block data)
    # path = "/tmp/blocks"

    # Output path for writing AccountsDB data to
    # accounts_path = "/mnt/accountsdb"

    # Path of full snapshot or AccountsDB to load from (verifier mode)
    # snapshot_archive_path = "/path/to/snapshot-or-accountsdb"

    # Filename containing incremental snapshot
    # incremental_snapshot = ""

# ============================================================================
# [rpc] - RPC configuration
# ============================================================================

[rpc]
    # RPC endpoint(s) for fetching blocks and block downloads
    # Can be a single URL or a list of URLs for load balancing
    # rpc = ["https://api.mainnet-beta.solana.com"]
    # rpc = ["https://rpc1.example.com", "https://rpc2.example.com"]

    # RPC server port. Set to 0 to disable (default).
    # When enabled, exposes a Solana-compatible JSON-RPC interface.
    # port = 8899

# ============================================================================
# [replay] - Block replay settings
# ============================================================================

[replay]
    # Transaction parallelism. Set to 0 for sequential execution,
    # or >0 to execute a topsort tx plan with the given number of workers.
    # txpar = 96

    # Number of slots to replay (verifier mode)
    # num_slots = 0

    # Block at which to stop replaying, inclusive (verifier mode)
    # -1 means no limit
    # end_slot = -1

    # Load from a full snapshot (verifier mode)
    # load_from_snapshot = false

    # Load from AccountsDB (verifier mode)
    # load_from_accounts_db = false

# ============================================================================
# [development] - Development and tuning options
# ============================================================================

[development]
    # Zstd decoder concurrency (defaults to NumCPU)
    # zstd_decoder_concurrency = 16

    # Bound for number of log shards to flush to Accounts DB Index at once
    # max_concurrent_flushers = 16

    # Size in MB for serialized parameter arena (0 to disable)
    # param_arena_size_mb = 512

    # Number of borrowed accounts to preallocate in arena (0 to disable)
    # borrowed_account_arena_size = 1024

    # Enable/disable pool allocator for slices
    # use_pool = true

    # [development.pprof] - Profiling options
    [development.pprof]
        # Port to serve HTTP pprof endpoint (-1 to disable)
        # port = 6060

        # Filename to write CPU profile
        # cpu_profile_path = "/tmp/cpuprof.pprof"

    # [development.debug] - Debug logging options
    [development.debug]
        # Transaction signatures to enable debug logging for
        # transaction_signatures = ["sig1", "sig2"]

        # Account pubkeys to enable debug logging of transactions that modify them
        # account_writes = ["pubkey1", "pubkey2"]

# ============================================================================
# [reporting] - Metrics and reporting
# ============================================================================

[reporting]
    # Filename to write JSONL records of latencies
    # metrics_path = "/tmp/metrics.jsonl"

# ============================================================================
# [block] - Block source configuration
# ============================================================================

[block]
    # Block source for verify-live mode: "rpc" or "overcast"
    # source = "rpc"

    # Overcast endpoint address (only used when source = "overcast")
    # If source = "overcast" but no endpoint is provided, falls back to RPC
    # overcast_endpoint = "localhost:9000"

# ============================================================================
# [snapshot] - Snapshot download configuration
# ============================================================================

[snapshot]
    # Path to download snapshot to (only used if save_to_disk = true)
    # download_path = ""

    # Save snapshots to disk while streaming (requires download_path)
    # When true: streams from network while saving to disk and processing (parallel)
    # When false: streams from network and processes without saving (saves disk space)
    # save_to_disk = false

    # Enable verbose output showing detailed node discovery statistics
    # verbose = false

    # -------------------------------------------------------------------------
    # Stage 1: Fast Parallel Triage
    # Quickly tests many nodes in parallel to eliminate slow ones
    # -------------------------------------------------------------------------

    # Warmup data before timing (KiB)
    # stage1_warm_kib = 512

    # Size of each measurement window (KiB)
    # stage1_window_kib = 512

    # Number of measurement windows (total data = windows * window_kib)
    # stage1_windows = 4

    # Timeout for stage 1 testing per node (milliseconds)
    # stage1_timeout_ms = 3000

    # Number of concurrent downloads in stage 1 (0 = auto, uses CPU cores)
    # stage1_concurrency = 0

    # -------------------------------------------------------------------------
    # Stage 2: Sustained Speed Test
    # Tests top candidates from stage 1 with longer downloads
    # -------------------------------------------------------------------------

    # Number of top candidates from stage 1 to test in stage 2
    # stage2_top_k = 8

    # Warmup duration before measurement (seconds)
    # stage2_warm_sec = 2

    # Measurement duration (seconds)
    # stage2_measure_sec = 2

    # Minimum speed ratio (collapse if speed drops below this * peak)
    # stage2_min_ratio = 0.6

    # Minimum absolute speed (MB/s, 0 = disabled)
    # stage2_min_abs_mbs = 0.0

    # -------------------------------------------------------------------------
    # Node Filtering
    # -------------------------------------------------------------------------

    # Maximum RTT to consider a node (milliseconds, 0 = disabled)
    # max_rtt_ms = 200

    # TCP connection timeout for pre-check (milliseconds)
    # tcp_timeout_ms = 1000

    # Minimum Solana version required (e.g., "2.2.0", empty = no filter)
    # min_node_version = "2.2.0"

    # Allowed Solana versions (empty = all versions allowed)
    # Example: allowed_node_versions = ["2.2.0", "3.0.0"]
    # allowed_node_versions = []

    # -------------------------------------------------------------------------
    # Snapshot Age Thresholds
    # -------------------------------------------------------------------------

    # Maximum age for full snapshots (slots)
    # full_threshold = 100000

    # Maximum age for incremental snapshots (slots)
    # incremental_threshold = 200

    # Safety margin - warn if snapshot is this close to expiration (slots)
    # safety_margin_slots = 5000

    # -------------------------------------------------------------------------
    # Snapshot Retention
    # -------------------------------------------------------------------------

    # Maximum number of full snapshots to keep (0 = unlimited)
    # max_full_snapshots = 2

    # Automatically delete old snapshots based on age thresholds
    # delete_old_snapshots = false

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------

    # Number of concurrent workers for node evaluation
    # worker_count = 100

    # -------------------------------------------------------------------------
    # Fallback Resilience
    # -------------------------------------------------------------------------

    # Maximum number of ranked snapshot sources to try before giving up
    # This is a resilience mechanism - if the #1 fastest node's HTTP endpoint
    # is down or snapshot was deleted, we try the next best ranked nodes.
    # Set to 0 to try all available nodes.
    # max_snapshot_url_attempts = 3

    # -------------------------------------------------------------------------
    # Incremental Snapshot Selection
    # -------------------------------------------------------------------------

    # Minimum download speed for incremental snapshot sources (MB/s)
    # Incrementals are ~1GB, so this filters out nodes that would take too long.
    # At 2 MB/s: ~8 minutes for 1GB (acceptable)
    # Set to 0 to disable speed filtering.
    # min_incremental_speed_mbs = 2.0
