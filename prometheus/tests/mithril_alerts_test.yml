rule_files:
  - ../rules/mithril.yml

evaluation_interval: 15s

tests:
  - name: missing target and deadman carry the expected identity
    interval: 15s
    input_series:
      - series: 'up{job="mithril-node",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'up{job="mithril-monitor",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'up{job="mithril-notifier",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'up{job="node-exporter",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'up{job="prometheus",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'up{job="alertmanager",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-node",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-monitor",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-notifier",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-agent",required="false",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="node-exporter",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="blackbox-exporter",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="prometheus",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="alertmanager",required="true",deployment_id="d1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilRequiredTargetMissing
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              job: blackbox-exporter
              severity: critical
            exp_annotations:
              summary: "A required scrape job has no target for this deployment"
      - eval_time: 1m
        alertname: MithrilDeadmanHeartbeat
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              severity: none
            exp_annotations:
              summary: "Deadman heartbeat; its absence means the alerting path failed"

  - name: down scrape target fires then recovers
    interval: 15s
    input_series:
      - series: 'up{job="mithril-node",deployment_id="d1"}'
        values: '0+0x8 1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-node",required="true",deployment_id="d1"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilScrapeTargetDown
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              job: mithril-node
              severity: critical
            exp_annotations:
              summary: "A required scrape target is down"
      - eval_time: 4m
        alertname: MithrilScrapeTargetDown
        exp_alerts: []

  - name: prometheus anchors missing monitor before signed inventory is available
    interval: 15s
    input_series:
      - series: 'up{job="prometheus",deployment_id="d1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilRequiredTargetMissing
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              job: mithril-monitor
              severity: critical
            exp_annotations:
              summary: "A required scrape job has no target for this deployment"

  - name: monitor down remains alertable after its inventory is stale
    interval: 15s
    input_series:
      - series: 'up{job="mithril-monitor",deployment_id="d1"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilScrapeTargetDown
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              job: mithril-monitor
              severity: critical
            exp_annotations:
              summary: "A required scrape target is down"

  - name: deadman heartbeat disappears with the monitoring source
    interval: 15s
    input_series:
      - series: 'up{job="prometheus",deployment_id="d1"}'
        values: '1+0x3 stale'
    alert_rule_test:
      - eval_time: 30s
        alertname: MithrilDeadmanHeartbeat
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              severity: none
            exp_annotations:
              summary: "Deadman heartbeat; its absence means the alerting path failed"
      - eval_time: 2m
        alertname: MithrilDeadmanHeartbeat
        exp_alerts: []

  - name: monitoring peer and blackbox probe failures fire
    interval: 15s
    input_series:
      - series: 'up{job="prometheus-peer",deployment_id="d1",instance="peer"}'
        values: '0+0x12'
      - series: 'probe_success{job="mithril-rpc-offhost",deployment_id="d1",instance="node-rpc"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitoringPeerDown
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              instance: peer
              job: prometheus-peer
              severity: critical
            exp_annotations:
              summary: "The required monitoring peer is absent, unreachable, or has invalid policy"
      - eval_time: 2m
        alertname: MithrilBlackboxProbeDown
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              instance: node-rpc
              job: mithril-rpc-offhost
              severity: critical
            exp_annotations:
              summary: "The off-host RPC blackbox probe is failing"

  - name: monitoring peer applicability gates absence
    interval: 15s
    input_series:
      - series: 'up{job="prometheus",deployment_id="required",monitoring_peer_required="true"}'
        values: '1+0x12'
      - series: 'up{job="prometheus",deployment_id="optional",monitoring_peer_required="false"}'
        values: '1+0x12'
      - series: 'up{job="prometheus",deployment_id="invalid",monitoring_peer_required="maybe"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitoringPeerDown
        exp_alerts:
          - exp_labels:
              deployment_id: required
              job: prometheus-peer
              severity: critical
            exp_annotations:
              summary: "The required monitoring peer is absent, unreachable, or has invalid policy"
          - exp_labels:
              deployment_id: invalid
              job: prometheus-peer
              severity: critical
            exp_annotations:
              summary: "The required monitoring peer is absent, unreachable, or has invalid policy"

  - name: monitor identity rejects missing mismatched duplicate malformed and non-one rows
    interval: 15s
    input_series:
      - series: 'up{job="mithril-monitor",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="other",systemd_unit="mithril.service",systemd_scope="system",deployment_id="mismatch"}'
        values: '1+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="duplicate",systemd_unit="mithril.service",systemd_scope="system",deployment_id="duplicate",instance="one"}'
        values: '1+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="duplicate",systemd_unit="mithril.service",systemd_scope="system",deployment_id="duplicate",instance="two"}'
        values: '1+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="bad id",systemd_unit="mithril.service",systemd_scope="system",deployment_id="malformed"}'
        values: '1+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="bad-unit",systemd_unit="mithril.target",systemd_scope="system",deployment_id="bad-unit"}'
        values: '1+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="bad-value",systemd_unit="mithril.service",systemd_scope="system",deployment_id="bad-value"}'
        values: '2+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="user",systemd_unit="mithril.service",systemd_scope="user",deployment_id="user"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitorIdentityInvalid
        exp_alerts:
          - exp_labels:
              deployment_id: bad-unit
              severity: critical
            exp_annotations:
              summary: "The off-host monitor deployment identity is missing or invalid"
          - exp_labels:
              deployment_id: bad-value
              severity: critical
            exp_annotations:
              summary: "The off-host monitor deployment identity is missing or invalid"
          - exp_labels:
              deployment_id: duplicate
              severity: critical
            exp_annotations:
              summary: "The off-host monitor deployment identity is missing or invalid"
          - exp_labels:
              deployment_id: malformed
              severity: critical
            exp_annotations:
              summary: "The off-host monitor deployment identity is missing or invalid"
          - exp_labels:
              deployment_id: mismatch
              severity: critical
            exp_annotations:
              summary: "The off-host monitor deployment identity is missing or invalid"
          - exp_labels:
              deployment_id: missing
              severity: critical
            exp_annotations:
              summary: "The off-host monitor deployment identity is missing or invalid"
          - exp_labels:
              deployment_id: user
              severity: critical
            exp_annotations:
              summary: "The off-host monitor deployment identity is missing or invalid"

  - name: exact monitor identity and custom system unit are accepted
    interval: 15s
    input_series:
      - series: 'up{job="mithril-monitor",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_monitor_identity_info{signed_deployment_id="d1",systemd_unit="mithril-mainnet.service",systemd_scope="system",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'node_systemd_unit_state{name="mithril-mainnet.service",state="active",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'node_systemd_service_restart_total{name="mithril-mainnet.service",deployment_id="d1"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitorIdentityInvalid
        exp_alerts: []
      - eval_time: 2m
        alertname: MithrilServiceDown
        exp_alerts: []
      - eval_time: 2m
        alertname: MithrilServiceRestartLoop
        exp_alerts: []

  - name: monitor inventory rejects a missing role and fractional boolean
    interval: 15s
    input_series:
      - series: 'up{job="mithril-monitor",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="node",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="reference_primary",deployment_id="d1"}'
        values: '0.5+0x12'
      - series: 'mithril_monitor_collect_success{collector="node_rpc",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="reference_rpc",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="state",deployment_id="d1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitorMetricsInvalid
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              severity: critical
            exp_annotations:
              summary: "The off-host monitor metric inventory is invalid"

  - name: complete monitor inventory is accepted
    interval: 15s
    input_series:
      - series: 'up{job="mithril-monitor",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="node",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="reference_primary",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="reference_fallback",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_last_success_timestamp_seconds{role="node",deployment_id="d1"}'
        values: '0+15x12'
      - series: 'mithril_rpc_probe_last_success_timestamp_seconds{role="reference_primary",deployment_id="d1"}'
        values: '0+15x12'
      - series: 'mithril_rpc_probe_last_success_timestamp_seconds{role="reference_fallback",deployment_id="d1"}'
        values: '0+15x12'
      - series: 'mithril_node_replay_slot{node_view="local_replay",deployment_id="d1"}'
        values: '100+1x12'
      - series: 'mithril_reference_slot{role="primary",commitment="confirmed",deployment_id="d1"}'
        values: '100+1x12'
      - series: 'mithril_reference_slot{role="fallback",commitment="confirmed",deployment_id="d1"}'
        values: '100+1x12'
      - series: 'mithril_node_slot_delta{role="primary",node_view="local_replay",commitment="confirmed",deployment_id="d1"}'
        values: '0+0x12'
      - series: 'mithril_node_slot_delta{role="fallback",node_view="local_replay",commitment="confirmed",deployment_id="d1"}'
        values: '0+0x12'
      - series: 'mithril_reference_slot_disagreement_slots{commitment="confirmed",deployment_id="d1"}'
        values: '0+0x12'
      - series: 'mithril_monitor_collect_success{collector="node_rpc",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="reference_rpc",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="state",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_monitor_last_collection_timestamp_seconds{deployment_id="d1"}'
        values: '0+15x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitorMetricsInvalid
        exp_alerts: []

  - name: future monitor timestamps fail closed
    interval: 15s
    input_series:
      - series: 'up{job="mithril-monitor",deployment_id="future"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="node",deployment_id="future"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="reference_primary",deployment_id="future"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_success{role="reference_fallback",deployment_id="future"}'
        values: '1+0x12'
      - series: 'mithril_rpc_probe_last_success_timestamp_seconds{role="node",deployment_id="future"}'
        values: '1000+0x12'
      - series: 'mithril_rpc_probe_last_success_timestamp_seconds{role="reference_primary",deployment_id="future"}'
        values: '1000+0x12'
      - series: 'mithril_rpc_probe_last_success_timestamp_seconds{role="reference_fallback",deployment_id="future"}'
        values: '1000+0x12'
      - series: 'mithril_node_replay_slot{node_view="local_replay",deployment_id="future"}'
        values: '100+1x12'
      - series: 'mithril_reference_slot{role="primary",commitment="confirmed",deployment_id="future"}'
        values: '100+1x12'
      - series: 'mithril_reference_slot{role="fallback",commitment="confirmed",deployment_id="future"}'
        values: '100+1x12'
      - series: 'mithril_node_slot_delta{role="primary",node_view="local_replay",commitment="confirmed",deployment_id="future"}'
        values: '0+0x12'
      - series: 'mithril_node_slot_delta{role="fallback",node_view="local_replay",commitment="confirmed",deployment_id="future"}'
        values: '0+0x12'
      - series: 'mithril_reference_slot_disagreement_slots{commitment="confirmed",deployment_id="future"}'
        values: '0+0x12'
      - series: 'mithril_monitor_collect_success{collector="node_rpc",deployment_id="future"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="reference_rpc",deployment_id="future"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="state",deployment_id="future"}'
        values: '1+0x12'
      - series: 'mithril_monitor_last_collection_timestamp_seconds{deployment_id="future"}'
        values: '1000+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitorMetricsInvalid
        exp_alerts:
          - exp_labels:
              deployment_id: future
              severity: critical
            exp_annotations:
              summary: "The off-host monitor metric inventory is invalid"

  - name: state collector row is required and boolean
    interval: 15s
    input_series:
      - series: 'mithril_monitor_collect_success{collector="node_rpc",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="reference_rpc",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="node_rpc",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="reference_rpc",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_monitor_collect_success{collector="state",deployment_id="invalid"}'
        values: '0.5+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilMonitorMetricsInvalid
        exp_alerts:
          - exp_labels:
              deployment_id: invalid
              severity: critical
            exp_annotations:
              summary: "The off-host monitor metric inventory is invalid"
          - exp_labels:
              deployment_id: missing
              severity: critical
            exp_annotations:
              summary: "The off-host monitor metric inventory is invalid"

  - name: signed target inventory rejects missing duplicate and invalid rows
    interval: 15s
    input_series:
      - series: 'mithril_expected_target{target_job="mithril-node",required="true",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-monitor",required="true",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-notifier",required="true",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="node-exporter",required="true",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="blackbox-exporter",required="true",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="prometheus",required="true",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="alertmanager",required="true",deployment_id="missing"}'
        values: '1+0x12'

      - series: 'mithril_expected_target{target_job="mithril-node",required="true",deployment_id="duplicate",instance="one"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-node",required="true",deployment_id="duplicate",instance="two"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-monitor",required="true",deployment_id="duplicate"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-notifier",required="true",deployment_id="duplicate"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="node-exporter",required="true",deployment_id="duplicate"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="blackbox-exporter",required="true",deployment_id="duplicate"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="prometheus",required="true",deployment_id="duplicate"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="alertmanager",required="true",deployment_id="duplicate"}'
        values: '1+0x12'

      - series: 'mithril_expected_target{target_job="mithril-node",required="false",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-monitor",required="true",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-notifier",required="true",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="unknown",required="false",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="node-exporter",required="true",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="blackbox-exporter",required="true",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="prometheus",required="true",deployment_id="invalid"}'
        values: '0+0x12'
      - series: 'mithril_expected_target{target_job="alertmanager",required="maybe",deployment_id="invalid"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilSignedTargetInventoryInvalid
        exp_alerts:
          - exp_labels:
              deployment_id: duplicate
              severity: critical
            exp_annotations:
              summary: "The signed target inventory is missing or invalid"
          - exp_labels:
              deployment_id: invalid
              severity: critical
            exp_annotations:
              summary: "The signed target inventory is missing or invalid"
          - exp_labels:
              deployment_id: missing
              severity: critical
            exp_annotations:
              summary: "The signed target inventory is missing or invalid"

  - name: exact signed target inventory is accepted
    interval: 15s
    input_series:
      - series: 'mithril_expected_target{target_job="mithril-node",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-monitor",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-notifier",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="mithril-agent",required="false",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="node-exporter",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="blackbox-exporter",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="prometheus",required="true",deployment_id="d1"}'
        values: '1+0x12'
      - series: 'mithril_expected_target{target_job="alertmanager",required="true",deployment_id="d1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilSignedTargetInventoryInvalid
        exp_alerts: []

  - name: signed filesystem inventory rejects missing duplicate and invalid rows
    interval: 15s
    input_series:
      - series: 'mithril_expected_filesystem_role{role="root",required="true",deployment_id="missing"}'
        values: '1+0x12'
      - series: 'mithril_expected_filesystem_role{role="accounts",required="true",deployment_id="missing"}'
        values: '1+0x12'

      - series: 'mithril_expected_filesystem_role{role="root",required="true",deployment_id="duplicate",instance="one"}'
        values: '1+0x12'
      - series: 'mithril_expected_filesystem_role{role="root",required="true",deployment_id="duplicate",instance="two"}'
        values: '1+0x12'
      - series: 'mithril_expected_filesystem_role{role="accounts",required="true",deployment_id="duplicate"}'
        values: '1+0x12'
      - series: 'mithril_expected_filesystem_role{role="ledger",required="true",deployment_id="duplicate"}'
        values: '1+0x12'

      - series: 'mithril_expected_filesystem_role{role="root",required="false",deployment_id="invalid"}'
        values: '1+0x12'
      - series: 'mithril_expected_filesystem_role{role="accounts",required="true",deployment_id="invalid"}'
        values: '0+0x12'
      - series: 'mithril_expected_filesystem_role{role="unknown",required="maybe",deployment_id="invalid"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: MithrilSignedFilesystemInventoryInvalid
        exp_alerts:
