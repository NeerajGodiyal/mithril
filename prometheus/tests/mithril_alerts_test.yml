              summary: "Verification reports divergence"
      - eval_time: 2m
        alertname: MithrilVerificationDiverged
        exp_alerts: []
      - eval_time: 3m
        alertname: MithrilVerificationStalled
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              severity: critical
              state: stalled
            exp_annotations:
              summary: "Required trailing verification has stalled"
      - eval_time: 6m
        alertname: MithrilVerificationUnavailable
        exp_alerts:
          - exp_labels:
              deployment_id: d1
              severity: critical
              state: unavailable
            exp_annotations:
              summary: "Required verification evidence is unavailable"

